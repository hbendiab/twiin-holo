<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Twiin</title>
<style>
  html { background: linear-gradient(180deg, #eceef1, #d3dcf0); height: 100%; }
  body { margin: 0; height: 100%; display: grid; place-items: center; font: 14px/1.5 -apple-system, sans-serif; color: #16181d; text-align: center; -webkit-app-region: drag; }
  b { display: block; font-size: 18px; letter-spacing: -.02em; }
  span { color: #6b7180; }
  .fail { display: none; } body[data-state="fail"] .fail { display: block; } body[data-state="fail"] .wait { display: none; }
  code { background: #fff; padding: 2px 6px; border-radius: 6px; font-size: 12px; }
</style></head>
<body><div>
  <div class="wait"><b>Twiin démarre…</b><span>Lancement du serveur sur ce Mac.</span></div>
  <div class="fail"><b>Twiin n'a pas pu démarrer</b><span>Dans un terminal : <code>cd twiin/recorder && node server.js</code>,<br>puis relance l'app.</span></div>
</div></body></html>
