# Filtre « appli métier ou non » (brief, couches 1 et 2) et catalogue des applis connues.
# - exclusion : jamais métier (navigateurs, loisirs, utilitaires) → est_metier false, methode liste_exclusion
# - applis    : applis métier connues → catégorie + disponibilité de l'API ; reconnues par nom d'appli, identifiant
#               d'appli (bundle id) ou domaine web. Les identifiants (id) sont ceux de la bibliothèque de tâches.
# Les domaines servent aussi de FILTRE de confidentialité : un domaine du navigateur qui n'est pas ici n'est jamais gardé.

