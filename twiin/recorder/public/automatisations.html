<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twiin · Mes automatisations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="pages.css">
<style>
  .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: -14px 0 24px; font-size: 13px; color: var(--text-dim); }
  .layout { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .list { display: grid; gap: 10px; }
  .item { text-align: left; display: grid; gap: 6px; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--panel-border); }
  .item.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .item b { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.35; }
  .item .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dash h2 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.3; }
  .dash .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 18px; }
  .flow .blk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 10px; border-radius: 10px;
               background: var(--panel-2); border: 1px solid var(--panel-border); }
  .flow .blk.holo { border-color: var(--warn); }
  .flow .blk.holo.cloud { border-color: var(--ok); }
  .flow .blk em { font-style: normal; font-size: 10.5px; font-weight: 600; margin-left: 4px; color: var(--text-dim); }
  .flow .arrow { color: var(--text-dim); font-size: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi { padding: 12px 14px; border-radius: 12px; background: var(--panel-2); }
  .kpi span { display: block; font-size: 12px; color: var(--text-dim); }
  .kpi b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .section { border-top: 1px solid var(--panel-border); padding-top: 16px; margin-top: 18px; }
  .section h3 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .freq { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select { font: 14px var(--font); padding: 9px 12px; border-radius: 10px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--text); }
  .note { font-size: 12.5px; color: var(--text-dim); margin: 8px 0 0; }
  .note.warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--panel-border); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .table-wrap { overflow-x: auto; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .choice { margin-top: 12px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--warn); background: var(--warn-soft); }
  .choice p { margin: 0 0 10px; font-size: 14px; }
  .choice input[type=time] { font: 14px var(--font); padding: 6px 8px; border-radius: 8px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--text); margin-left: 6px; }
  .planned { font-size: 13.5px; margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span id="logoCells"></span><span>Tw<b>ii</b>n</span></a>
    <nav class="nav"><a href="/#enregistrer">Analyser une tâche</a><a href="/videos.html">Mes vidéos</a><a href="/automatisations.html" aria-current="page">Mes automatisations</a><a href="/back.html" class="nav-back">Back</a></nav>
    <button id="themeBtn" type="button">Thème sombre</button>
  </header>

  <h1>Mes automatisations</h1>
  <div class="status-row" id="statusRow"></div>

  <div class="layout" id="layout" hidden>
    <div class="list" id="list"></div>
    <section class="panel dash" id="dash"></section>
  </div>
  <div class="panel empty" id="empty" hidden><b>Aucune automatisation pour l'instant</b>Analyse une tâche, puis choisis « Créer l'automatisation n8n » à l'étape 4.
    <p><a class="btn primary" href="/#enregistrer">Analyser une tâche</a></p></div>

<script src="/vendor/supabase/supabase.js"></script>
  <script src="shell.js" defer></script>
  <script src="auth.js"></script>
  <script src="banner.js"></script>
  <script src="common.js"></script>
<script>
const KIND = { holo: 'Holo · logiciel sans API', sheets: 'Google Sheets', verify: 'Vérification', code: 'Mise en forme', http: 'API', other: 'Étape' };
let items = [], current = null, poll = null, n8nUrl = '';
// Créneaux où le Mac est souvent libre
const CRENEAUX = [['midi', 'Pause déjeuner (12 h 30)'], ['soir', 'Fin de journée (18 h 30)'], ['matin', 'Demain avant mon arrivée (8 h 30)']];
const CRENEAU_AT = { midi: ['12:30'], soir: ['18:30'], matin: ['08:30', true] };
const HEURES = [['08:30', 'à 8 h 30, avant ton arrivée'], ['09:00', 'à 9 h'], ['12:30', 'à 12 h 30, pause déjeuner'], ['18:30', 'à 18 h 30, fin de journée']];
// Prochaine occurrence d'une heure (aujourd'hui si elle n'est pas passée, sinon demain)
function prochaine(hhmm, demain = false) {
  const [h, m] = hhmm.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (demain || d <= new Date()) d.setDate(d.getDate() + 1);
  return d;
}
function quand(iso) {
  const d = new Date(iso), now = new Date(), demain = new Date(); demain.setDate(now.getDate() + 1);
  const h = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }).replace(':', ' h ');
  return d.toDateString() === now.toDateString() ? `aujourd'hui à ${h}` : d.toDateString() === demain.toDateString() ? `demain à ${h}` : `le ${fmtDate(iso)}`;
}

const statusPill = (a) => a.failed ? '<span class="pill bad">Pas créée</span>' : a.running ? '<span class="pill run">En cours</span>'
  : a.active ? '<span class="pill on">Active</span>' : '<span class="pill">En pause</span>';
const execPill = (e) => e.status === 'success' ? '<span class="pill on">Réussie</span>'
  : ['running', 'new', 'waiting'].includes(e.status) ? '<span class="pill run">En cours</span>'
  : ['canceled', 'cancelled', 'crashed'].includes(e.status) && e.status !== 'crashed' ? '<span class="pill">Arrêtée</span>'
  : `<span class="pill bad">${escapeHtml({ error: 'Échec', crashed: 'Plantée' }[e.status] || e.status)}</span>`;
const blockIcon = (b) => iconsHtml(b.kind === 'holo' ? `Holo ${b.name}` : b.kind === 'sheets' ? 'Google Sheets' : b.name, 2);

async function load(keep) {
  let d;
  try { d = await (await fetch('/api/automations')).json(); } catch { d = { error: 'Le serveur Twiin ne répond pas.' }; }
  const row = document.getElementById('statusRow');
  if (d.error) { row.innerHTML = `<span class="pill bad">${escapeHtml(d.error)}</span>`; return; }
  if (!d.up) {
    row.innerHTML = '<span class="pill warn">n8n est arrêté</span> <button id="startN8n" type="button">Démarrer n8n</button> <span>Twiin le démarre aussi tout seul quand il en a besoin.</span>';
    document.getElementById('startN8n').onclick = async (ev) => {
      ev.target.disabled = true; ev.target.textContent = 'Démarrage (10 à 30 s)…';
      await fetch('/api/n8n/start', { method: 'POST' }).catch(() => {});
      load();
    };
    document.getElementById('layout').hidden = true;
    return;
  }
  n8nUrl = d.n8n_url;
  row.innerHTML = `<span>${d.automations.length} automatisation${d.automations.length > 1 ? 's' : ''}</span>`;
  items = d.automations.sort((a, b) => (b.stats.last || b.updated || '').localeCompare(a.stats.last || a.updated || ''));
  document.getElementById('empty').hidden = items.length > 0;
  document.getElementById('layout').hidden = !items.length;
  renderList();
  const want = keep || decodeURIComponent(location.hash.slice(1));
  select((items.find((a) => a.id === want) || items[0])?.id);
  const running = items.find((a) => a.running);
  if (running) watch(running.id); // une exécution lancée avant d'ouvrir la page
}

function renderList() {
  document.getElementById('list').innerHTML = items.map((a) => `
    <button class="item ${a.id === current ? 'on' : ''}" data-id="${a.id}" type="button">
      <span class="row">${a.blocks.map(blockIcon).join('')}</span>
      <b>${escapeHtml(a.name)}</b>
      <span class="row">${statusPill(a)}<span class="meta">${escapeHtml(a.freq_label)}</span></span>
      <span class="meta">${a.failed ? `Création échouée ${fmtAgo(a.stats.last)}` : `Dernière exécution : ${fmtAgo(a.stats.last)} · ${a.stats.total ? `${Math.round((100 * a.stats.success) / a.stats.total)} % réussies` : 'jamais lancée'}`}</span>
    </button>`).join('');
  document.querySelectorAll('.item').forEach((b) => b.addEventListener('click', () => select(b.dataset.id)));
}

function select(id) {
  current = id;
  const a = items.find((x) => x.id === id);
  if (!a) return;
  history.replaceState(null, '', `#${id}`);
  document.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
  if (a.failed) { // création échouée : la cause, de quoi la corriger, et réessayer
    document.getElementById('dash').innerHTML = `
      <h2>${escapeHtml(a.name)}</h2>
      <div class="pills"><span class="pill bad">Pas créée</span></div>
      <p class="note warn"><b>Cause :</b> ${escapeHtml(a.error || 'inconnue')}</p>
      <p class="meta">${/google sheets|credential|connexion/i.test(a.error || '')
        ? 'Il manque une connexion dans n8n : ajoute-la une fois (Credentials → New), elle servira ensuite à toutes les automatisations.'
        : 'Ouvre n8n pour voir le détail, puis réessaie.'}</p>
      <div class="flow">${a.blocks.map((b, i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="blk ${b.kind}">${escapeHtml(b.name)}</span>`).join('')}</div>
      <div class="actions">
        <a class="btn primary" href="${a.fix_url}" target="_blank" rel="noopener">${iconsHtml('n8n', 1)}Configurer dans n8n</a>
        <button id="retryBtn" type="button">Réessayer la création</button>
      </div>
      <div class="msg" id="msg"></div>`;
    document.getElementById('retryBtn').onclick = async (ev) => {
      ev.target.disabled = true;
      document.getElementById('msg').textContent = 'Création dans n8n…';
      const d = await (await fetch(`/api/automations/${encodeURIComponent(id)}/retry`, { method: 'POST' })).json().catch(() => ({}));
      if (d.error) { document.getElementById('msg').textContent = `Toujours impossible : ${d.error}`; ev.target.disabled = false; return; }
      load(id);
    };
    return;
  }
  const holo = a.blocks.filter((b) => b.kind === 'holo').length;
  const holoMac = a.blocks.filter((b) => b.kind === 'holo' && b.env !== 'cloud').length;
  const est = a.stats.avg_s || Math.max(60, holo * 150);
  const rate = a.stats.total ? `${Math.round((100 * a.stats.success) / a.stats.total)} %` : '—';
  document.getElementById('dash').innerHTML = `
    <h2>${escapeHtml(a.name)}</h2>
    <div class="pills">${statusPill(a)}<span class="pill">${escapeHtml(a.freq_label)}</span>${holoMac ? '<span class="pill warn">Utilise ton ordinateur</span>' : ''}</div>
    <div class="flow">${a.blocks.map((b, i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="blk ${b.kind}${b.env === 'cloud' ? ' cloud' : ''}" title="${escapeHtml(b.kind === 'holo' ? (b.env === 'cloud' ? 'Holo dans le navigateur cloud de H : ne touche pas ton ordinateur' : 'Holo sur ton ordinateur : prend la souris') : KIND[b.kind])}">${blockIcon(b)}${escapeHtml(b.name)}</span>`).join('')}</div>
    <div class="kpis">
      <div class="kpi"><span>Exécutions</span><b>${a.stats.total}</b></div>
      <div class="kpi"><span>Réussite</span><b>${rate}</b></div>
      <div class="kpi"><span>Durée moyenne</span><b>${fmtDur(a.stats.avg_s)}</b></div>
      <div class="kpi"><span>Dernière</span><b style="font-size:15px">${fmtAgo(a.stats.last)}</b></div>
    </div>
    <div class="actions">
      <button class="primary" id="runBtn" type="button" ${a.running ? 'disabled' : ''}>${a.running ? 'En cours…' : holoMac ? 'Lancer…' : 'Lancer maintenant'}</button>
      <button class="danger" id="stopBtn" type="button" ${a.running ? '' : 'hidden'}>Arrêter l'automatisation</button>
      ${a.sheet ? `<a class="btn" href="${a.sheet.url}" target="_blank" rel="noopener">${iconsHtml('Google Sheets', 1)}Ouvrir le résultat</a>` : ''}
    </div>
    ${holoMac ? '<p class="note warn">Elle utilise ton ordinateur pendant qu\'elle tourne : ne touche à rien.</p>' : ''}
    ${a.plan ? `<p class="planned">Lancement programmé <b>${escapeHtml(quand(a.plan))}</b>. Tu seras prévenu 2 min avant. <a href="#" id="unplan">Annuler</a></p>` : ''}
    <div class="choice" id="runChoice" hidden>
      <p><b>Elle a besoin de ton ordinateur pendant environ ${Math.ceil(est / 60)} min</b> (souris et clavier). Quand veux-tu la lancer ?</p>
      <div class="actions">
        <button type="button" data-when="now" class="primary">Maintenant</button>
        ${CRENEAUX.map(([k, l]) => `<button type="button" data-when="${k}">${l}</button>`).join('')}
      </div>
      <div class="actions" style="margin-top:8px"><label class="meta">Autre heure <input type="time" id="whenOther" value="17:00"></label>
        <button type="button" data-when="other">Programmer</button></div>
    </div>
    <div class="msg" id="msg"></div>

    <div class="section"><h3>Quand elle tourne</h3>
      <div class="freq">
        <select id="sType" aria-label="Type de planification">
          ${[['manual', 'Manuellement (en pause)'], ['daily', 'Chaque jour'], ['weekly', 'Certains jours de la semaine'], ['monthly', 'Un jour précis du mois']]
            .map(([k, l]) => `<option value="${k}" ${(a.schedule?.type || 'manual') === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <span id="sDays" class="freq">${[[1, 'Lun'], [2, 'Mar'], [3, 'Mer'], [4, 'Jeu'], [5, 'Ven'], [6, 'Sam'], [0, 'Dim']]
          .map(([d, l]) => `<label class="meta"><input type="checkbox" value="${d}" ${(a.schedule?.days || [1]).includes(d) ? 'checked' : ''}> ${l}</label>`).join(' ')}</span>
        <label class="meta" id="sDom">le <select id="sMonthday">${Array.from({ length: 31 }, (_, i) => i + 1)
          .map((d) => `<option value="${d}" ${(a.schedule?.monthday || 1) === d ? 'selected' : ''}>${d === 1 ? '1er' : d}</option>`).join('')}</select></label>
        <label class="meta" id="sAt">à <select id="sHour">${Array.from({ length: 24 }, (_, h) => h)
          .map((h) => `<option value="${h}" ${(a.schedule?.hour ?? 9) === h ? 'selected' : ''}>${String(h).padStart(2, '0')} h</option>`).join('')}</select>
          <select id="sMinute">${[0, 15, 30, 45].map((m) => `<option value="${m}" ${(a.schedule?.minute || 0) === m ? 'selected' : ''}>${String(m).padStart(2, '0')}</option>`).join('')}</select></label>
        <button id="saveFreq" type="button">Enregistrer</button>
      </div>
      ${holoMac ? '<p class="note">Choisis un moment où tu n\'utilises pas ton ordinateur (allumé, sans veille).</p>' : ''}
    </div>

    <div class="section"><h3>Historique</h3>
      ${a.executions.length ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Durée</th><th>Résultat</th></tr></thead><tbody>
        ${a.executions.map((e) => `<tr><td class="num">${fmtDate(e.startedAt)}</td>
          <td class="num">${e.stoppedAt ? fmtDur((new Date(e.stoppedAt) - new Date(e.startedAt)) / 1000) : '—'}</td><td>${execPill(e)}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="meta">Pas encore d\'exécution.</p>'}
    </div>`;

  const lancer = async () => {
    const msg = document.getElementById('msg');
    const r = await fetch(`/api/automations/${encodeURIComponent(id)}/run`, { method: 'POST' });
    const d = await r.json();
    if (d.error) { msg.textContent = d.error; return; }
    msg.textContent = holoMac ? 'Lancée. Ton Mac est utilisé : un bandeau en bas de l\'écran indique le temps restant.' : 'Lancée. Tu peux continuer à travailler.';
    document.getElementById('runChoice').hidden = true;
    document.getElementById('runBtn').disabled = true;
    document.getElementById('stopBtn').hidden = false;
    watch(id);
  };
  // Une automatisation qui utilise le Mac : on choisit le moment (maintenant ou un créneau où le Mac est libre)
  document.getElementById('runBtn').onclick = () => (holoMac ? (document.getElementById('runChoice').hidden = false) : lancer());
  document.querySelectorAll('[data-when]').forEach((b) => b.onclick = async () => {
    const w = b.dataset.when;
    if (w === 'now') return lancer();
    const at = w === 'other' ? prochaine(document.getElementById('whenOther').value) : prochaine(...CRENEAU_AT[w]);
    const d = await (await fetch(`/api/automations/${encodeURIComponent(id)}/plan`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                                                 body: JSON.stringify({ at: at.toISOString(), name: a.name }) })).json();
    if (d.error) { document.getElementById('msg').textContent = d.error; return; }
    a.plan = d.at; select(id);
  });
  document.getElementById('unplan')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch(`/api/automations/${encodeURIComponent(id)}/plan`, { method: 'DELETE' });
    a.plan = null; select(id);
  });
  const sType = document.getElementById('sType');
  const showSched = () => {
    const t = sType.value;
    document.getElementById('sDays').hidden = t !== 'weekly';
    document.getElementById('sDom').hidden = t !== 'monthly';
    document.getElementById('sAt').hidden = t === 'manual';
  };
  sType.onchange = showSched;
  showSched();
  document.getElementById('stopBtn').onclick = async (ev) => {
    ev.target.disabled = true;
    const d = await (await fetch(`/api/automations/${encodeURIComponent(id)}/stop`, { method: 'POST' })).json().catch(() => ({}));
    document.getElementById('msg').textContent = `Arrêtée${d.stopped?.length ? ` (${d.stopped.join(', ')})` : ''}. Tu as repris la main.`;
    clearInterval(poll);
    setTimeout(() => select(id), 1500);
  };
  document.getElementById('saveFreq').onclick = async (ev) => {
    const msg = document.getElementById('msg');
    ev.target.disabled = true;
    const schedule = { type: sType.value, hour: +document.getElementById('sHour').value, minute: +document.getElementById('sMinute').value,
                       monthday: +document.getElementById('sMonthday').value,
                       days: [...document.querySelectorAll('#sDays input:checked')].map((c) => +c.value) };
    const r = await fetch(`/api/automations/${encodeURIComponent(id)}/schedule`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                                         body: JSON.stringify({ schedule }) });
    const d = await r.json();
    ev.target.disabled = false;
    if (d.error) { msg.textContent = `Réglage impossible : ${d.error}`; return; }
    Object.assign(items.find((x) => x.id === id), d);
    renderList(); select(id);
    document.getElementById('msg').textContent = d.active ? `Activée : ${d.freq_label.toLowerCase()}.` : 'En pause : tu la lances quand tu veux.';
  };
}

function watch(id) {
  clearInterval(poll);
  poll = setInterval(async () => {
    const a = await (await fetch(`/api/automations/${encodeURIComponent(id)}`)).json().catch(() => null);
    if (!a || a.error) return;
    Object.assign(items.find((x) => x.id === id), a);
    if (!a.running) { clearInterval(poll); renderList(); if (current === id) select(id); }
  }, 4000);
  const a = items.find((x) => x.id === id);
  if (a) { a.running = true; renderList(); if (current === id) select(id); }
}

iconsReady.then(() => load());
</script>
</body>
</html>
