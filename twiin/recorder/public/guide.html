<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twiin · guide</title>
<!-- Jumeaux guides : pendant une automatisation, Iris et Ilo suivent la souris (fenêtre transparente de l'app Mac,
     desktop/main.js) et disent ce qui se passe, à l'écrit et à voix haute. Ne reçoit aucun clic. -->
<style>
  :root { --ink: #161615; --dim: #5d5d58; --strong: #56669c; --rule: #dce2f0; color-scheme: light; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; color: var(--ink); letter-spacing: -.006em; }
  .g { position: absolute; left: 6px; top: 6px; display: flex; align-items: flex-start; gap: 8px; transition: opacity .3s; }
  .g.cache { opacity: 0; }
  .duo { display: flex; gap: 3px; flex: none; filter: drop-shadow(0 6px 10px rgba(30,34,60,.35)); }
  .duo img { width: 36px; height: 36px; display: block; }
  .duo.parle img { animation: parle .32s ease-in-out infinite alternate; }
  .duo[data-qui="iris"] .ilo, .duo[data-qui="ilo"] .iris { display: none; } /* seul celui qui parle */
  @keyframes parle { to { transform: translateY(-4px) scale(1.04); } }
  .bulle { max-width: 300px; padding: 9px 13px 10px; border-radius: 4px 14px 14px 14px; background: rgba(255,255,255,.96); border: 1px solid var(--rule);
    box-shadow: 0 14px 28px -14px rgba(40,46,80,.55); animation: entre .35s cubic-bezier(.16,1,.3,1) both; }
  .bulle small { display: block; font: 500 10px ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--strong); margin-bottom: 2px; }
  .bulle p { margin: 0; font-size: 14px; font-weight: 500; }
  .faits { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .faits span { font: 500 10px ui-monospace, Menlo, monospace; padding: 2px 6px; border-radius: 999px; background: #e6ebf5; color: var(--strong); }
  @keyframes entre { from { opacity: 0; transform: translateY(4px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { .bulle { animation: none; } }
</style>
</head>
<body>
  <div class="g cache" id="g" role="status" aria-live="polite">
    <span class="duo" id="duo" data-qui="iris" aria-hidden="true"><img class="iris" src="img/iris.png" alt=""><img class="ilo" src="img/ilo.png" alt=""></span>
    <div class="bulle" id="bulle"><small id="kick">Twiin</small><p id="phrase"></p><div class="faits" id="faits"></div></div>
  </div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let derniere = '', tour = 0, son = null;
  const muet = new URLSearchParams(location.search).has('muet');
  function dire(texte) {
    if (muet) return;
    try { son?.pause(); } catch { /* rien */ }
    const voix = tour++ % 2 ? 'ilo' : 'iris';
    $('duo').dataset.qui = voix;
    son = new Audio(`/api/voice/say?voix=${voix}&text=${encodeURIComponent(texte)}`);
    $('duo').classList.add('parle');
    son.onended = son.onerror = () => $('duo').classList.remove('parle');
    son.play().catch(() => $('duo').classList.remove('parle'));
  }
  async function suivre() {
    let d = null;
    try { d = await (await fetch('/api/guide', { cache: 'no-store' })).json(); } catch { /* serveur indisponible */ }
    if (!d?.actif) { $('g').classList.add('cache'); derniere = ''; return; }
    $('g').classList.remove('cache');
    $('kick').textContent = `${d.titre}${d.index && d.total > 1 ? ` · étape ${d.index}/${d.total}` : ''}${d.cloud ? ' · dans le cloud' : ''}`;
    $('faits').innerHTML = (d.faits || []).slice(-3).map((f) => `<span>${f.replace(/^Holo\s*[—-]\s*/i, '').replace(/[<>&]/g, '')} ✓</span>`).join('');
    if (d.phrase && d.phrase !== derniere) {
      derniere = d.phrase;
      $('phrase').textContent = d.phrase;
      const b = $('bulle'); b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
      if (!/…$/.test(d.phrase)) dire(d.phrase);
    }
  }
  suivre();
  setInterval(suivre, 1200);
})();
</script>
</body>
</html>
