<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twiin · Mes enregistrements</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* onglets : un sélecteur discret (pas deux gros boutons) */
  .tabs { display: inline-flex; gap: 2px; margin: 0 0 22px; padding: 3px; border-radius: 12px; background: var(--brand-chip, var(--chip)); }
  .tabs button { background: transparent !important; box-shadow: none !important; padding: 7px 14px !important; font-size: 14px !important; color: color-mix(in srgb, var(--ink) 60%, transparent) !important; }
  .tabs button[aria-pressed="true"] { background: #fff !important; color: var(--ink) !important; box-shadow: 0 2px 6px -3px rgba(24,21,32,.3) !important; }
  :root[data-theme="dark"] .tabs button[aria-pressed="true"] { background: var(--canvas) !important; }
  /* la prochaine étape : une phrase, un seul bouton plein */
  .hero { padding: 22px 24px; margin: 0 0 26px; border-radius: var(--r-panel, 12px); background: var(--glass-fill, var(--wash)); border: 1px solid var(--brand-strong, var(--accent)); box-shadow: var(--glass-shadow, none); }
  .hero .kick { margin: 0 0 6px; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--brand-strong, var(--accent)); }
  .hero h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .hero p.why { margin: 0 0 16px; font-size: 15px; color: color-mix(in srgb, var(--ink) 70%, transparent); }
  .hero .acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .hero .acts .btn, .hero .acts button { padding: 12px 20px !important; font-size: 15px !important; text-decoration: none; }
  /* liste : une ligne par enregistrement, une action, le reste dans « Plus » */
  .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px !important; }
  .logos { display: flex; }
  .logos img, .logos .vide { width: 38px; height: 38px; border-radius: 10px; background: #fff; padding: 5px; border: 1px solid var(--brand-rule, var(--rule)); object-fit: contain; }
  .logos img + img { margin-left: -10px; }
  .logos .vide { display: block; background: var(--brand-chip, var(--chip)); }
  .row .t { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .row .m { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 3px; font-size: 13.5px; color: color-mix(in srgb, var(--ink) 62%, transparent); }
  .etat { font: 500 11.5px var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--brand-chip, var(--chip)); color: var(--ink); }
  .etat.attente { background: var(--warn-soft, #fbf6d6); color: var(--warn, #9a6b00); }
  .row .a { display: flex; gap: 8px; align-items: center; }
  .row .a .btn, .row .a > button { padding: 9px 14px !important; font-size: 14px !important; text-decoration: none; white-space: nowrap; background: #fff !important; border: 1px solid var(--brand-strong, var(--accent)) !important; color: var(--brand-strong, var(--accent)) !important; }
  :root[data-theme="dark"] .row .a .btn, :root[data-theme="dark"] .row .a > button { background: transparent !important; }
  .menu { position: relative; }
  .menu summary { list-style: none; cursor: pointer; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink); }
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary:hover, .menu[open] summary { background: var(--brand-chip, var(--chip)); }
  .menu summary svg { width: 18px; height: 18px; fill: currentColor; }
  .menu .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 230px; padding: 6px; border-radius: 12px; background: var(--canvas);
    border: 1px solid var(--brand-rule, var(--rule)); box-shadow: 0 18px 40px -18px rgba(24,21,32,.4); display: grid; }
  .menu .pop a, .menu .pop button { all: unset; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--ink); }
  .menu .pop a:hover, .menu .pop button:hover { background: var(--brand-chip, var(--chip)); }
  .menu .pop .danger { color: var(--bad, #c0392b) !important; }
  .menu .pop hr { border: 0; border-top: 1px solid var(--brand-rule, var(--rule)); margin: 4px 0; }
  @media (max-width: 680px) { .row { grid-template-columns: auto minmax(0, 1fr); } .row .a { grid-column: 1 / -1; } }
  .grp { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin: 6px 0 12px; }
  .grp span { font: 500 12px var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--brand-chip, var(--chip)); }
  .grp-d { margin-top: 26px; }
  .grp-d summary { list-style: none; cursor: pointer; }
  .grp-d summary::-webkit-details-marker { display: none; }
  .grp-d summary .grp::before { content: "▸"; font-size: 13px; color: var(--brand-strong, var(--accent)); transition: transform .2s; }
  .grp-d[open] summary .grp::before { transform: rotate(90deg); }
  .rec { margin: 0 0 12px; }
  .rec-src { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; background: var(--accent-soft); color: var(--text); }
  .rec-titre { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  .rec-date { font-size: 13px; color: var(--text-dim); margin: 0; }
  .rec-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .rec-actions button.danger { color: #c0392b; }
  .notice { font-size: 13px; color: var(--text-dim); margin: 0 0 16px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft, rgba(127,127,127,.12)); }
  #msg { min-height: 22px; font-size: 13px; color: var(--text-dim); margin: 0 0 14px; }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span id="logoCells"></span><span>Tw<b>ii</b>n</span></a>
    <nav class="nav"><a href="/">Analyser une tâche</a><a href="/enregistrements.html" aria-current="page">Mes enregistrements</a><a href="/videos.html">Mes vidéos</a><a href="/automatisations.html">Mes automatisations</a><a href="/back.html" class="nav-back">Back</a></nav>
    <button id="themeBtn" type="button">Thème sombre</button>
  </header>

  <h1>Mes enregistrements</h1>
  <div class="tabs">
    <button type="button" data-tab="enr" aria-pressed="true">Enregistrements</button>
    <button type="button" data-tab="corb" aria-pressed="false">Corbeille</button>
  </div>
  <p id="msg" role="status"></p>
  <section id="liste"></section>
  <section id="corbeille" hidden></section>

<script src="shell.js" defer></script>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (iso) => (iso ? new Date(iso).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }) : '—');
const msg = (t) => { document.getElementById('msg').textContent = t || ''; };
let vue = 'enr';

function setTab(t) {
  vue = t;
  document.querySelectorAll('[data-tab]').forEach((b) => {
    const actif = b.dataset.tab === t;
    b.setAttribute('aria-pressed', String(actif));
  });
  document.getElementById('liste').hidden = t !== 'enr';
  document.getElementById('corbeille').hidden = t !== 'corb';
  msg('');
  charger();
}

async function charger() {
  if (vue === 'enr') {
    const { sessions = [] } = await (await fetch('/api/sessions')).json();
    if (typeof iconsReady !== 'undefined') await iconsReady.catch(() => {}); // logos des applis (common.js)
    document.getElementById('liste').innerHTML = sessions.length
      ? (() => {
          const pretes = sessions.filter((e) => e.analyse), brutes = sessions.filter((e) => !e.analyse);
          return heros(sessions)
            + (pretes.length ? `<h2 class="grp">Prêtes à automatiser <span>${pretes.length}</span></h2><ul class="rows">${pretes.map(carteEnr).join('')}</ul>` : '')
            + (brutes.length ? `<details class="grp-d"${pretes.length ? '' : ' open'}><summary><h2 class="grp">À analyser <span>${brutes.length}</span></h2></summary>
                <ul class="rows">${brutes.map(carteEnr).join('')}</ul></details>` : '');
        })()
      : `<div class="hero"><p class="kick">Ta prochaine étape</p><h2>Enregistre ta première tâche</h2>
          <p class="why">Fais une tâche répétitive devant Twiin : il la découpe en étapes et prépare son automatisation.</p>
          <div class="acts"><a class="btn primary" href="/#enregistrer">Enregistrer une tâche</a></div></div>`;
  } else {
    const { items = [], jours = 30 } = await (await fetch('/api/corbeille')).json();
    document.getElementById('corbeille').innerHTML =
      `<p class="notice">Les enregistrements mis à la corbeille sont supprimés définitivement au bout de ${jours} jours.</p>` +
      `<div class="rec-actions" style="margin:0 0 14px"><button class="danger" id="vider" ${items.length ? '' : 'disabled'}>Vider la corbeille</button></div>` +
      (items.length ? items.map(carteCorb).join('') : '<p class="meta">La corbeille est vide.</p>');
  }
}

// La prochaine étape : d'abord analyser ce qui attend, sinon automatiser la tâche la plus récente
const PHONE = '<svg viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;vertical-align:-2px;margin-right:4px"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>';
const lien = (id, q = '') => `/?session=${encodeURIComponent(id)}${q}#enregistrer`;
function heros(list) {
  const prete = list.find((e) => e.analyse);
  const attente = prete ? null : list.find((e) => !e.analyse); // d'abord avancer une tâche prête ; sinon analyser
  if (attente) return `<div class="hero" data-id="${esc(attente.id)}"><p class="kick">Ta prochaine étape</p>
      <h2>Analyser « ${esc(attente.titre || 'ton enregistrement')} »</h2>
      <div class="acts"><button type="button" class="primary rec-go" data-act="analyser">Analyser</button></div></div>`;
  const e = prete;
  return `<div class="hero"><p class="kick">Ta prochaine étape</p>
      <h2>Automatiser « <span data-court>${esc(e.titre || 'ta dernière tâche')}</span> »</h2>
      <div class="acts"><a class="btn primary" href="${lien(e.id, '&faire=automatiser')}">Automatiser cette tâche</a>
        <a class="btn quiet" href="${lien(e.id, '&faire=video')}">ou en faire une vidéo</a></div></div>`;
}
// Une ligne par enregistrement : logos des applis, titre, date et état ; UNE action, le reste dans « Plus »
function carteEnr(e) {
  const logos = typeof findIcons === 'function' ? findIcons(e.titre || '', 3) : [];
  const etat = e.analyse ? `<span class="etat">${e.nb_etapes} étapes</span>` : '<span class="etat attente">À analyser</span>';
  return `<li class="card row rec" data-id="${esc(e.id)}">
    <span class="logos" aria-hidden="true">${logos.length ? logos.map((x) => `<img src="icons/${x.file}" alt="">`).join('') : '<span class="vide"></span>'}</span>
    <span><span class="t" data-court>${esc(e.titre || 'Enregistrement')}</span>
      <span class="m">${etat}<span>${fmt(e.startedAt)}</span>${e.source === 'telecommande' ? `<span>${PHONE}Depuis le téléphone</span>` : ''}${e.ajouts ? `<span>${e.ajouts} passage(s) ajouté(s)</span>` : ''}</span></span>
    <span class="a">
      ${e.analyse ? `<a class="btn" href="${lien(e.id, '&faire=automatiser')}">Automatiser</a>` : '<button type="button" data-act="analyser">Analyser</button>'}
      <details class="menu"><summary aria-label="Plus d'actions"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></summary>
        <div class="pop">
          ${e.analyse ? `<a href="${lien(e.id, '&faire=video')}">Créer la vidéo de formation</a>
            <a href="${lien(e.id)}">Ouvrir et modifier les étapes</a>
            <a href="${lien(e.id, '&ajout=1')}">Ajouter un passage oublié</a><hr>` : ''}
          <button type="button" class="danger" data-act="supprimer">Mettre à la corbeille</button>
        </div></details>
    </span></li>`;
}

function carteCorb(e) {
  const reste = e.jours_restants != null ? ` · supprimé définitivement dans ${e.jours_restants} jour(s)` : '';
  return `<article class="panel rec" data-id="${esc(e.id)}">
    <p class="rec-titre"><span data-court>${esc(e.titre || 'Enregistrement')}</span>${e.source === 'telecommande' ? '<span class="rec-src"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;vertical-align:-2px;margin-right:4px"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>Depuis le téléphone</span>' : ''}</p>
    <p class="rec-date">${fmt(e.startedAt)} · mis à la corbeille le ${fmt(e.supprime_le)}${reste}</p>
    <div class="rec-actions">
      <button data-act="restaurer">Restaurer</button>
      <button class="danger" data-act="supprimer-def">Supprimer définitivement</button>
    </div>
  </article>`;
}

document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));

document.getElementById('liste').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-act]');
  if (!b) return;
  const id = (b.closest('.rec') || b.closest('.hero')).dataset.id;
  if (b.dataset.act === 'analyser') {
    if (!confirm('Analyser cet enregistrement utilise Holo et coûte un peu d\'argent. Continuer ?')) return;
    b.disabled = true; b.textContent = 'Analyse en cours…';
    const d = await (await fetch(`/api/sessions/${encodeURIComponent(id)}/analyze`, { method: 'POST' })).json();
    msg(d.error || 'Analyse terminée.');
    return charger();
  }
  if (b.dataset.act === 'supprimer') {
    if (!confirm('Mettre cet enregistrement à la corbeille ? Il sera supprimé définitivement au bout de 30 jours.')) return;
    const d = await (await fetch(`/api/sessions/${encodeURIComponent(id)}`, { method: 'DELETE' })).json();
    msg(d.error || 'Enregistrement mis à la corbeille.');
    return charger();
  }
});

document.getElementById('corbeille').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.id === 'vider') {
    if (!confirm('Vider la corbeille supprime définitivement tous ses enregistrements. C\'est irréversible. Continuer ?')) return;
    const d = await (await fetch('/api/corbeille/vider', { method: 'POST' })).json();
    msg(`Corbeille vidée (${d.supprimes} enregistrement(s) supprimé(s)).`);
    return charger();
  }
  const id = b.closest('.rec').dataset.id;
  if (b.dataset.act === 'restaurer') {
    const d = await (await fetch(`/api/corbeille/${encodeURIComponent(id)}/restaurer`, { method: 'POST' })).json();
    msg(d.error || 'Enregistrement restauré.');
    return charger();
  }
  if (b.dataset.act === 'supprimer-def') {
    if (!confirm('Supprimer définitivement cet enregistrement ? C\'est irréversible.')) return;
    const d = await (await fetch(`/api/corbeille/${encodeURIComponent(id)}`, { method: 'DELETE' })).json();
    msg(d.error || 'Supprimé définitivement.');
    return charger();
  }
});

// un seul menu « Plus » ouvert à la fois ; un clic ailleurs le ferme
document.addEventListener('click', (ev) => document.querySelectorAll('details.menu[open]').forEach((d) => { if (!d.contains(ev.target)) d.open = false; }));

// Le lien direct vers la corbeille (#corbeille) ouvre l'onglet corbeille
const ouvrirSelonAncre = () => setTab(location.hash === '#corbeille' ? 'corb' : 'enr');
window.addEventListener('hashchange', ouvrirSelonAncre);
ouvrirSelonAncre();
</script>
<script src="/vendor/supabase/supabase.js"></script>
<script src="auth.js"></script>
<script src="banner.js"></script>
<script src="common.js"></script>
</body>
</html>
