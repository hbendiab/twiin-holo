[project]
name = "twiin"
version = "0.1.0"
description = "Twiin : observer une tâche, l'analyser, la rejouer avec Holo, l'automatiser (n8n) ou en faire un tuto."
requires-python = ">=3.10"
dependencies = [
    "hai-agents[desktop]>=1.5",      # Holo (H Company) + pilotage du Mac
    "python-dotenv>=1.0",
    "requests>=2.31",
    "openai>=1.0",                   # appels au modèle d'analyse (Hugging Face, compatible OpenAI) pour les tutos
    "pillow>=10",                    # taille des captures des tutos
    "mutagen>=1.47",                 # durée des voix off ElevenLabs
    "json-repair>=0.30",             # réparation des réponses JSON du modèle
    "faster-whisper>=1.1",           # transcription locale de la voix (capture vocale)
    "av<16",                         # faster-whisper lit l'audio avec av ; la v16+ casse faster-whisper (metadata_errors)
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "playwright>=1.45",              # découverte : agents Holo dans le jumeau (navigateur sans fenêtre)
    "openpyxl>=3.1",
    "pypdf>=5",                 # automatisations : lire une facture PDF (source d'une saisie)
    # Windows : journal d'actions (souris/clavier + UI Automation) et OCR intégré de Windows
    "pynput>=1.7; sys_platform == 'win32'",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "psutil>=5.9; sys_platform == 'win32'",
    "winocr>=0.0.13; sys_platform == 'win32'",
    "pyyaml>=6",                     # brique Audit v2 : bibliothèque de tâches (audit/data/taches_par_role.yaml)
    "jsonschema>=4.20",              # brique Audit v2 : validation de la fiche d'audit
]

[project.optional-dependencies]
test = ["pytest>=8"]                 # tests de la brique Audit : .venv/bin/python -m pytest audit/tests


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twiin*", "discovery*"]
