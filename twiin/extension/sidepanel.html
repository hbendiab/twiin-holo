<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twiin</title>
<link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="voice.css">
</head>
<body>
  <header class="top">
    <span class="brand"><img class="tw-logo" src="logo-twiin.webp" alt="">Twiin</span>
    <span id="conn" class="chip">…</span>
    <button id="openTwiin" class="round" type="button" aria-label="Ouvrir Twiin dans un onglet" title="Ouvrir Twiin dans un onglet"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v6H4V6h6"/></svg></button>
  </header>

  <div class="voicebar"><span id="voiceSlot"></span></div>

  <main id="app"><p class="muted">Connexion à Twiin…</p></main>

  <footer class="foot">
    <label class="switch"><input type="checkbox" id="bubbleToggle"> Bulle Twiin sur les pages</label>
    <span class="keys"><kbd>⌥⇧T</kbd> ouvrir · <kbd>⌥⇧R</kbd> enregistrer / terminer · <kbd>⌥⇧X</kbd> tout arrêter</span>
    <button id="resetHidden" class="link" type="button" hidden></button>
  </footer>
<script src="voice.js"></script>
<script src="capture.js"></script>
<script src="panel.js"></script>
</body>
</html>
