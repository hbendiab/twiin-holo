<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twiin</title>
<link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="voice.css">
<link rel="stylesheet" href="reco.css">
<link rel="stylesheet" href="twiin-da.css">
</head>
<body>
  <header class="top">
    <span class="brand"><span class="tw-twins" aria-hidden="true"><i class="tw-orb iris"></i><i class="tw-orb ilo"></i></span>Twiin</span>
    <span id="conn" class="chip">…</span>
    <button id="openTwiin" class="round" type="button" aria-label="Ouvrir Twiin dans le navigateur" title="Ouvrir Twiin dans le navigateur"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v6H4V6h6"/></svg></button>
    <button id="hideWin" class="round" type="button" aria-label="Réduire dans le Dock" title="Réduire dans le Dock (⌥⌘T pour masquer)"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  </header>

  <!-- Pastille pendant un enregistrement -->
  <div class="pill" aria-live="polite">
    <span class="pdot"></span><b id="pillTime">00:00</b>
    <span class="pinfo" id="pillInfo"></span>
    <button class="pbtn" id="pillPause" type="button" aria-label="Pause" title="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <button class="b dark" id="pillStop" type="button">Terminer</button>
    <button class="pbtn px" id="pillCancel" type="button" aria-label="Arrêter sans analyser" title="Arrêter sans analyser"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>

  <div class="voicebar"><span id="voiceSlot"></span></div>

  <main id="app"><p class="muted">Connexion à Twiin…</p></main>

  <footer class="foot">
    <span class="keys"><kbd>⌥⌘T</kbd> afficher / masquer</span>
    <label class="switch" hidden><input type="checkbox" id="bubbleToggle"></label>
    <button id="resetHidden" class="link" type="button" hidden></button>
  </footer>
<script src="desktop-shim.js"></script>
<script src="voice.js"></script>
<script src="reco.js"></script>
<script src="capture.js"></script>
<script src="panel.js"></script>
<script src="desktop.js"></script>
<script src="jumeaux.js"></script>
</body>
</html>
